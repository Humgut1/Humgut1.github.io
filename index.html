<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>펭귄 작업실</title>
<meta name="description" content="펭귄이 안내하는 HR 개인 프로젝트 모음">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><ellipse cx='50' cy='56' rx='34' ry='40' fill='%231E2430'/><ellipse cx='50' cy='62' rx='22' ry='30' fill='%23F7F5F0'/><ellipse cx='50' cy='38' rx='22' ry='15' fill='%23F7F5F0'/><circle cx='42' cy='37' r='3' fill='%231E2430'/><circle cx='58' cy='37' r='3' fill='%231E2430'/><path d='M45 44H55L50 50Z' fill='%23F2A33A'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --sky-top: #CFE6F7; --sky-bot: #F4FAFE; --fg: #1E2430; --muted: #4F5A6E;
  --ice: #FFFFFF; --ice-edge: #BFDCF0; --ice-shadow: #9CC5E3; --chip: #E6F2FB;
  --navy: #1E2430; --cream: #F7F5F0; --beak: #F2A33A; --beak-dark: #C97F1E;
  --snow: #FFFFFF; --floor: #EAF4FB; --floor-edge: #B5D6EE;
}
@media (prefers-color-scheme: dark) {
  :root {
    --sky-top: #0B1224; --sky-bot: #18233D; --fg: #EEF3FA; --muted: #A9B5C9;
    --ice: #1C2840; --ice-edge: #33476B; --ice-shadow: #0A0F1D; --chip: #263553;
    --navy: #F7F5F0; --cream: #1E2430; --snow: #DCE8F7; --floor: #22314F; --floor-edge: #3B5582;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; color: var(--fg); background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 520px, var(--sky-bot) 100%);
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  line-height: 1.65; word-break: keep-all; -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
a { color: inherit; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px; position: relative; }
.jua { font-family: "Jua", sans-serif; font-weight: 400; }

/* 눈 */
.snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.snow i { position: absolute; top: -12px; border-radius: 50%; background: var(--snow); opacity: .85; animation: fall linear infinite; }
@keyframes fall { to { transform: translate3d(var(--drift), 105vh, 0); } }

/* 오로라 (밤에만) */
.aurora { display: none; }
@media (prefers-color-scheme: dark) {
  .aurora { display: block; position: absolute; inset: 0 0 auto 0; height: 420px; pointer-events: none; z-index: 0;
    background: radial-gradient(60% 50% at 30% 20%, rgba(79,212,154,.22), transparent 70%), radial-gradient(50% 40% at 75% 10%, rgba(126,160,255,.22), transparent 70%); }
}

/* 첫 화면 */
.hero { position: relative; z-index: 1; display: grid; grid-template-columns: 1.2fr 1fr; align-items: end; gap: 24px; padding-top: 56px; }
.hero .kicker { display: inline-block; font-size: 14px; color: var(--muted); background: var(--ice); border: 1px solid var(--ice-edge); padding: 4px 12px; border-radius: 99px; margin: 0 0 16px; }
.hero h1 { font-size: clamp(38px, 7vw, 64px); line-height: 1.1; margin: 0 0 14px; }
.hero h1 b { color: var(--beak-dark); font-weight: 400; }
@media (prefers-color-scheme: dark) { .hero h1 b { color: var(--beak); } }
.hero .lead { font-size: 17px; color: var(--muted); margin: 0 0 24px; max-width: 480px; }
.hero .lead strong { color: var(--fg); font-weight: 700; }
.hero-text { padding-bottom: 64px; }
.hero-art { position: relative; justify-self: center; width: min(320px, 80vw); }
.hero-art svg { display: block; width: 100%; height: auto; overflow: visible; cursor: pointer; }
.bubble {
  position: absolute; top: -6px; left: -28px; background: var(--ice); color: var(--fg); border: 2px solid var(--navy);
  border-radius: 18px; padding: 8px 14px; font-size: 16px; white-space: nowrap; box-shadow: 3px 3px 0 var(--navy); transition: transform .25s;
}
.bubble::after { content: ""; position: absolute; right: 34px; bottom: -10px; width: 14px; height: 14px; background: var(--ice); border-right: 2px solid var(--navy); border-bottom: 2px solid var(--navy); transform: rotate(45deg); }
.bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 170px 300px; }
@keyframes bob { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
.wave { animation: wave 1.1s ease-in-out infinite; transform-origin: 214px 204px; }
@keyframes wave { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-22deg); } }
.blink { animation: blink 4.5s infinite; transform-origin: 170px 150px; }
@keyframes blink { 0%,94%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.hop { animation: hop .5s ease-out; }
@keyframes hop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-26px); } }

.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: 15px; font-weight: 700;
  padding: 10px 18px; border-radius: 99px; border: 2px solid var(--navy); background: var(--ice); color: var(--fg);
  box-shadow: 3px 3px 0 var(--navy); transition: transform .12s, box-shadow .12s;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--navy); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--navy); }
.btn.primary { background: var(--beak); color: #1E2430; }
.btn.off { border-style: dashed; box-shadow: none; color: var(--muted); cursor: default; font-weight: 500; }
.btn.off:hover { transform: none; }
:focus-visible { outline: 3px solid var(--beak); outline-offset: 3px; }

/* 얼음 바닥 */
.floor { position: relative; z-index: 1; height: 46px; margin-top: -2px; }
.floor svg { position: absolute; left: 50%; transform: translateX(-50%); width: max(1200px, 100vw); height: 46px; display: block; }

/* 카드 */
.section-title { position: relative; z-index: 1; display: flex; align-items: baseline; gap: 12px; margin: 48px 0 20px; }
.section-title h2 { font-size: 30px; margin: 0; }
.section-title p { margin: 0; color: var(--muted); font-size: 15px; }
.grid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; padding-bottom: 40px; }
.card {
  background: var(--ice); border: 2px solid var(--ice-edge); border-radius: 22px; overflow: hidden;
  box-shadow: 0 8px 0 var(--ice-shadow); display: flex; flex-direction: column; transition: transform .2s, box-shadow .2s;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 12px 0 var(--ice-shadow); }
.art { position: relative; height: 190px; display: flex; align-items: flex-end; justify-content: center; background: var(--tint); overflow: hidden; }
.art::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 26px; background: rgba(255,255,255,.55); border-top: 2px solid rgba(255,255,255,.9); }
.art svg { position: relative; z-index: 1; height: 176px; width: auto; overflow: visible; margin-bottom: 6px; transition: transform .3s cubic-bezier(.3,1.6,.5,1); }
.card:hover .art svg { transform: translateY(-6px) rotate(-3deg); }
.art .role { position: absolute; z-index: 2; top: 14px; left: 14px; background: #FFFFFF; color: #1E2430; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; }
@media (prefers-color-scheme: dark) { .art { filter: saturate(.85) brightness(.88); } }
.body { padding: 20px 22px 22px; display: flex; flex-direction: column; flex: 1; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 2px; }
.type { font-size: 13px; font-weight: 700; color: var(--muted); }
.repo { font-size: 12px; color: var(--muted); font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
.card h3 { font-size: 26px; margin: 0 0 6px; line-height: 1.25; }
.desc { margin: 0 0 12px; font-size: 15px; }
.card ul { margin: 0 0 16px; padding: 0; list-style: none; font-size: 14.5px; color: var(--muted); }
.card li { position: relative; padding-left: 20px; margin: 4px 0; }
.card li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 9px; height: 7px; border-radius: 50% 50% 45% 45%; background: var(--beak); }
.stack { display: flex; flex-wrap: wrap; gap: 6px; margin: auto 0 18px; }
.stack span { font-size: 12px; background: var(--chip); padding: 3px 10px; border-radius: 99px; color: var(--muted); }

/* 발자국 */
footer { position: relative; z-index: 1; padding: 20px 0 48px; color: var(--muted); font-size: 14px; text-align: center; }
.steps { display: flex; justify-content: center; gap: 18px; margin-bottom: 12px; opacity: .7; }
.steps svg { width: 22px; height: 22px; }
.steps svg:nth-child(odd) { transform: translateY(6px) rotate(-10deg); }
.steps svg:nth-child(even) { transform: rotate(10deg); }

@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; padding-top: 36px; }
  .hero-text { padding-bottom: 0; }
  .hero-art { width: min(240px, 70vw); margin-top: 28px; }
  .bubble { left: -40px; font-size: 14px; }
  .grid { grid-template-columns: 1fr; }
  .section-title { flex-direction: column; gap: 2px; }
}
@media (prefers-reduced-motion: reduce) {
  .snow, .bob, .wave, .blink { animation: none !important; }
  .snow { display: none; }
}
</style>
</head>
<body>
<div class="snow" id="snow" aria-hidden="true"></div>
<div class="aurora" aria-hidden="true"></div>

<div class="wrap">
  <section class="hero">
    <div class="hero-text">
      <p class="kicker">🐧 HR · 개인 프로젝트 모음</p>
      <h1 class="jua">펭귄 <b>작업실</b>에<br>어서 오세요</h1>
      <p class="lead">채용 코디네이터로 일하며 불편했던 것들을 <strong>직접 만들고 있어요.</strong> 인사 시스템, 채용 관리, 채용 시장 데이터까지 펭귄들이 하나씩 안내해 드려요.</p>
      <div class="btns">
        <a class="btn primary" href="#projects">작품 보러 가기 ↓</a>
        <a class="btn" href="https://github.com/Humgut1">GitHub</a>
      </div>
    </div>
    <div class="hero-art">
      <div class="bubble jua" id="bubble">안녕하세요! 👋</div>
      <div id="hero"></div>

<div class="floor" aria-hidden="true">
  <svg viewBox="0 0 1200 46" preserveAspectRatio="none"><path d="M0 14 Q60 4 130 12 T270 10 T420 14 T560 8 T720 13 T880 9 T1040 14 T1200 10 V46 H0Z" fill="var(--floor)" stroke="var(--floor-edge)" stroke-width="2"/></svg>
</div>

<div class="wrap" id="projects">
  <div class="section-title">
    <h2 class="jua">펭귄들이 만든 것</h2>
    <p>카드 하나에 펭귄 하나, 프로젝트 하나</p>
  </div>
  <main class="grid" id="grid"></main>
</div>

  <div class="steps" aria-hidden="true" id="steps"></div>
  <div>© 2026 Humgut1 · 뒤뚱뒤뚱 GitHub Pages로 만들었어요</div>

<script>
// 펭귄 조각 (hr-portfolio 펭귄 모음과 같은 그림체)
const feet = '<ellipse cx="145" cy="298" rx="20" ry="8" fill="#F2A33A"/><ellipse cx="195" cy="298" rx="20" ry="8" fill="#F2A33A"/>';
const body = '<ellipse cx="170" cy="200" rx="80" ry="98" fill="#1E2430"/><ellipse cx="170" cy="152" rx="52" ry="36" fill="#F7F5F0"/>';

const flipL = '<ellipse cx="94" cy="222" rx="13" ry="38" transform="rotate(14 94 222)" fill="#1E2430" stroke="#465066" stroke-width="2"/>';

const glint = '<path d="M164 149H176" stroke="#1E2430" stroke-width="3" fill="none"/><path d="M124 138L164 143L162 161L129 159Z" fill="#FFFFFF" stroke="#1E2430" stroke-width="3" stroke-linejoin="round"/><path d="M216 138L176 143L178 161L211 159Z" fill="#FFFFFF" stroke="#1E2430" stroke-width="3" stroke-linejoin="round"/><path d="M134 156L144 143M142 157L152 144" stroke="#BFD3F2" stroke-width="2" fill="none"/>';
const sparks = '<path d="M226 112L230 126L244 130L230 134L226 148L222 134L208 130L222 126Z" fill="#FFFFFF" stroke="#1F4E9C" stroke-width="1.5" stroke-linejoin="round"/><path d="M252 104L254 111L261 113L254 115L252 122L250 115L243 113L250 111Z" fill="#FFFFFF" stroke="#1F4E9C" stroke-width="1.5" stroke-linejoin="round"/>';
const cowlick = '<path d="M166 105C160 88 172 80 184 86C177 89 175 96 178 105Z" fill="#1E2430"/>';
const roundGlasses = '<circle cx="150" cy="150" r="14" fill="none" stroke="#1E2430" stroke-width="3"/><circle cx="190" cy="150" r="14" fill="none" stroke="#1E2430" stroke-width="3"/><path d="M164 150H176" stroke="#1E2430" stroke-width="3" fill="none"/>';
const mug = '<path d="M267 246a7 7 0 010 14" fill="none" stroke="#3A2A1E" stroke-width="3"/><rect x="242" y="238" width="26" height="28" rx="5" fill="#FFFFFF" stroke="#3A2A1E" stroke-width="2"/><path d="M250 230q4-6 0-12M260 230q4-6 0-12" fill="none" stroke="#8A5A3C" stroke-width="2" stroke-linecap="round"/>';
const jacket = (c, s) => `<path d="M96 215C104 190 136 184 170 184C204 184 236 190 244 215C252 250 240 290 170 292C100 290 88 250 96 215Z" fill="${c}" stroke="${s}" stroke-width="2"/>`;

const clipboard = '<g transform="rotate(10 252 240)"><rect x="232" y="214" width="40" height="52" rx="4" fill="#C98B5A" stroke="#3A2A1E" stroke-width="2"/><rect x="238" y="222" width="28" height="38" rx="2" fill="#FFFFFF"/><rect x="244" y="209" width="16" height="9" rx="2" fill="#9AA4B5" stroke="#3A2A1E" stroke-width="1.5"/><path d="M242 230H262M242 238H262M242 246H256" stroke="#8FA3C4" stroke-width="2"/><path d="M242 252l3 3 6-6" stroke="#0A8A55" stroke-width="2" fill="none"/></g>';
const bell = '<g transform="rotate(-12 252 230)"><path d="M238 240Q238 214 252 212Q266 214 266 240Z" fill="#F2C94C" stroke="#3A2A1E" stroke-width="2"/><rect x="234" y="238" width="36" height="6" rx="3" fill="#F2C94C" stroke="#3A2A1E" stroke-width="2"/><circle cx="252" cy="249" r="4" fill="#3A2A1E"/></g><path d="M276 210q8 8 0 16M284 204q12 14 0 28" stroke="#E2703A" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
const svg = (inner, vb) => `<svg viewBox="${vb || '50 78 240 232'}" role="img" aria-hidden="true">${inner}</svg>`;

// 첫 화면 펭귄: 목도리 하고 손 흔들기
document.getElementById('hero').innerHTML = svg(
  '<ellipse cx="170" cy="304" rx="96" ry="10" fill="rgba(30,36,48,.12)"/>' +
  '<g class="bob" id="heroBody">' + feet + body + belly + flipL +
  '<g class="wave">' + flipUp + '</g>' + scarf + beak + eyes + blush + cowlick + '</g>',
  '50 70 240 245');

const projects = [
  { role: '인사팀장 펭귄', tint: '#DCE5F2', type: 'HR 플랫폼', repo: 'hr-system', name: 'TalentCore Core',
    desc: '직원·조직·근태·급여·성과를 한 곳에서. 근로기준법을 기본 동작으로 지키는 한국형 HR 플랫폼이에요.',

  { role: '면접관 펭귄', tint: '#E4DEFA', type: '채용 관리 (ATS)', repo: 'talentcore-hire', name: 'TalentCore Hire',

    points: ['공고 보드 한 화면에서 조율·판정·평가·오퍼까지', '면접관 여러 명의 연속 빈 시간을 찾아 제안', '색은 상태에만: 사람이 볼 것만 눈에 띄게'],
    stack: ['Next.js', 'Supabase', 'TypeScript'],

    art: svg(feet + body + belly + flipL + flipUp + beak + collarTie + glint + sparks) },

    desc: '국내외 회사의 채용 공고를 매일 모아서 디스코드로 알려 주고, 쌓인 데이터를 아카이브와 대시보드로 공개해요.',

    links: [['아카이브 보기', 'https://humgut1.github.io/hr-dashboard/explore/'], ['대시보드', 'https://humgut1.github.io/hr-dashboard/'], ['코드 비공개', null]],

  { role: '커피챗 펭귄', tint: '#FFE2C7', type: '소개 사이트', repo: 'hr-portfolio', name: '포트폴리오',
    desc: '“일로 왔어요” / “커피챗 하러 왔어요”를 고르면 펭귄이 옷을 갈아입고 말투가 바뀌는 자기소개 사이트예요.',
    points: ['내용은 같고 옷(분위기)만 갈아입는 구조', '학력·경력·프로젝트·자격증·연락처', '펭귄 그림까지 기획부터 제작을 직접'],
    stack: ['HTML', 'CSS', 'SVG'],
    links: [['사이트 보기', 'https://humgut1.github.io/hr-portfolio/'], ['코드', 'https://github.com/Humgut1/hr-portfolio']],
    art: svg(feet + body + jacket('#E2703A', '#3A2A1E') + '<path d="M152 185L170 232L188 185Z" fill="#F7F5F0" stroke="#3A2A1E" stroke-width="2" stroke-linejoin="round"/>' + sleeves('#E2703A', '#3A2A1E') + mug + beak + eyes + blush + roundGlasses + cowlick) }
];

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
document.getElementById('grid').innerHTML = projects.map(p => `
  <article class="card">
    <div class="art" style="--tint:${p.tint}"><span class="role">${p.role}</span>${p.art}</div>
    <div class="body">
      <div class="top"><span class="type">${p.type}</span><span class="repo">${p.repo}</span></div>
      <h3 class="jua">${p.name}</h3>
      <p class="desc">${esc(p.desc)}</p>
      <ul>${p.points.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      <div class="stack">${p.stack.map(x => `<span>${x}</span>`).join('')}</div>
      <div class="btns">${p.links.map(([t, u], i) => u
        ? `<a class="btn${i === 0 ? ' primary' : ''}" href="${u}">${t}</a>`
        : `<span class="btn off" title="비공개 저장소예요">${t}</span>`).join('')}</div>
    </div>
  </article>`).join('');

// 발자국
const foot = '<svg viewBox="0 0 24 24"><path d="M12 21V8M12 21L5 5M12 21L19 5" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/></svg>';
document.getElementById('steps').innerHTML = foot.repeat(7);

// 눈 내리기
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!reduce) {
  const snow = document.getElementById('snow');
  for (let i = 0; i < 40; i++) {
    const f = document.createElement('i'), s = 3 + Math.random() * 5;
    f.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s}px;--drift:${(Math.random() * 80 - 40).toFixed(0)}px;animation-duration:${(8 + Math.random() * 10).toFixed(1)}s;animation-delay:-${(Math.random() * 18).toFixed(1)}s;opacity:${(.4 + Math.random() * .5).toFixed(2)}`;
    snow.appendChild(f);
  }
}

// 펭귄 누르면 폴짝 + 말 바꾸기
const lines = ['안녕하세요! 👋', '제가 만든 것들이에요', '아래로 내려가 보세요 ↓', '뒤뚱뒤뚱…', '간지러워요!', '커피챗도 환영이에요 ☕'];
let n = 0;
const hero = document.getElementById('hero'), bubble = document.getElementById('bubble');
hero.addEventListener('click', () => {
  n = (n + 1) % lines.length;
  bubble.textContent = lines[n];
  if (reduce) return;
  hero.classList.remove('hop'); void hero.offsetWidth; hero.classList.add('hop');
});
</script>
</body>
</html>
